name: Publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: v1.1.0
      image_tag:
        description: Container image tag
        required: true
        default: 1.1.0

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shirenliang12-source/network_tools:${{ inputs.image_tag || github.ref_name }}
            ghcr.io/shirenliang12-source/network_tools:latest
          labels: |
            org.opencontainers.image.title=NetOps Console
            org.opencontainers.image.description=网络运维与故障排除工具平台
            org.opencontainers.image.source=https://github.com/shirenliang12-source/Network_tools
            org.opencontainers.image.version=${{ inputs.image_tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
